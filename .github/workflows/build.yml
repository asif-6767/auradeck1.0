name: AuraDeck Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auradeck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AuraDeck APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. Extract Android project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=""

            while IFS= read -r file; do
              if unzip -l "$file" | grep -q "app/build.gradle.kts"; then
                ZIP_FILE="$file"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname "*.zip")

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found!"
              exit 1
            fi

            echo "Extracting $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Android project verified."

      # 3. Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Generate Debug Keystore
      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore
          echo "Debug keystore ready."

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 6. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 7. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # 8. Verify build environment
      - name: Verify build environment
        run: |
          java -version
          gradle --version
          test -f debug.keystore

      # 9. Build AuraDeck Debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 10. Verify APK
      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "AuraDeck APK generated successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      # 11. Upload APK
      - name: Upload AuraDeck APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraDeck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Upload build reports on failure
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AuraDeck-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
